
services:
  searxng:
    build:
      context: .
      dockerfile: Dockerfile
    image: searxng-json:latest
    container_name: searxng_json
    restart: unless-stopped
    # ports:
    #   - "8080:8080"
    networks:
      - docker-mcp-searxng

  mcp-searxng:
    image: isokoliuk/mcp-searxng:latest
    container_name: mcp_searxng
    restart: unless-stopped
    networks:
      - docker-mcp-searxng
    environment:
      - SEARXNG_URL=http://searxng:8080
      - MCP_HTTP_PORT=8088
      - MCP_HTTP_HOST=0.0.0.0
    ports:
      - "127.0.0.1:8088:8088"

networks:
  docker-mcp-searxng:
    name: docker-mcp-searxng
    driver: bridge
